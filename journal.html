<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMC Trading Journal</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        h2, h3 { text-align: center; margin-top: 0; margin-bottom: 15px; }

        label {
            display: block;
            margin-top: 12px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-muted);
        }

        input, select, button {
            width: 100%;
            padding: 10px 12px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #0f172a;
            color: var(--text-main);
            box-sizing: border-box;
            font-size: 14px;
        }

        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }

        button {
            background: var(--primary);
            color: white;
            border: none;
            font-size: 15px;
            margin-top: 18px;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover { background: var(--primary-hover); }

        .btn-clear {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            margin-top: 10px;
        }

        .btn-clear:hover {
            background: var(--danger);
            color: white;
        }

        #status {
            margin-top: 8px;
            font-weight: 600;
            text-align: center;
            font-size: 13px;
            min-height: 20px;
            color: var(--success);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            margin-top: 10px;
        }

        th, td {
            padding: 8px 6px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .win { color: var(--success); font-weight: bold; }
        .loss { color: var(--danger); font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>SMC Trading Journal</h2>
    <div id="status">Ready</div>

    <div class="card">
        <form id="tradeForm">
            <h3>Log Entry</h3>

            <div class="row">
                <div>
                    <label>Date</label>
                    <input type="date" id="tDate" required>
                </div>
                <div>
                    <label>Pair</label>
                    <select id="tPair" required>
                        <option value="EURUSD">EUR/USD</option>
                        <option value="GBPUSD">GBP/USD</option>
                        <option value="XAUUSD">XAU/USD</option>
                        <option value="BTCUSD">BTC/USD</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div>
                    <label>Direction</label>
                    <select id="tDirection" required>
                        <option value="LONG">BUY (Long)</option>
                        <option value="SHORT">SELL (Short)</option>
                    </select>
                </div>
                <div>
                    <label>4H Trend</label>
                    <select id="tTrend4H" required>
                        <option value="Bullish">Bullish ↑</option>
                        <option value="Bearish">Bearish ↓</option>
                    </select>
                </div>
            </div>

            <label>15m POI</label>
            <select id="tPoi15m" required>
                <option value="Order Block">Order Block</option>
                <option value="Fair Value Gap">FVG</option>
                <option value="Liquidity Sweep">Liquidity Sweep</option>
            </select>

            <div class="row">
                <div>
                    <label>Fib %</label>
                    <input type="number" id="tFib" placeholder="e.g. 70">
                </div>
                <div>
                    <label>Risk ($)</label>
                    <input type="number" step="0.01" id="tRisk" placeholder="6.00">
                </div>
            </div>

            <div class="row">
                <div>
                    <label>Outcome</label>
                    <select id="tOutcome">
                        <option value="WIN">WIN</option>
                        <option value="LOSS">LOSS</option>
                        <option value="BE">Breakeven</option>
                    </select>
                </div>
                <div>
                    <label>PnL ($)</label>
                    <input type="number" step="0.01" id="tPnL" placeholder="+18.00">
                </div>
            </div>

            <label>Notes</label>
            <input type="text" id="tNotes" placeholder="Trade entry notes...">

            <button type="submit">Save Trade Entry</button>
        </form>
    </div>

    <div class="card">
        <h3>Recent Entries</h3>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Pair</th>
                        <th>Dir</th>
                        <th>Outcome</th>
                        <th>PnL ($)</th>
                    </tr>
                </thead>
                <tbody id="trade-history-body"></tbody>
            </table>
        </div>
        <button type="button" class="btn-clear" onclick="clearJournal()">Clear All Data</button>
    </div>
</div>

<script>
    // Set default date to today
    document.getElementById('tDate').valueAsDate = new Date();

    // Get trades from LocalStorage
    function getStoredTrades() {
        return JSON.parse(localStorage.getItem('smc_journal_trades') || '[]');
    }

    // Save Trade locally
    document.getElementById('tradeForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const trade = {
            date: document.getElementById('tDate').value,
            pair: document.getElementById('tPair').value,
            direction: document.getElementById('tDirection').value,
            trend4H: document.getElementById('tTrend4H').value,
            poi15m: document.getElementById('tPoi15m').value,
            fibPct: document.getElementById('tFib').value || 0,
            estRisk: document.getElementById('tRisk').value || 0,
            outcome: document.getElementById('tOutcome').value,
            pnl: parseFloat(document.getElementById('tPnL').value) || 0,
            notes: document.getElementById('tNotes').value
        };

        const trades = getStoredTrades();
        trades.push(trade);
        localStorage.setItem('smc_journal_trades', JSON.stringify(trades));

        document.getElementById('status').innerText = "✅ Trade Saved Locally!";
        this.reset();
        document.getElementById('tDate').valueAsDate = new Date();
        renderTable();

        setTimeout(() => {
            document.getElementById('status').innerText = "Ready";
        }, 2000);
    });

    // Render history table
    function renderTable() {
        const trades = getStoredTrades().reverse();
        const tbody = document.getElementById('trade-history-body');
        tbody.innerHTML = "";

        if (trades.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#94a3b8;">No entries saved yet.</td></tr>`;
            return;
        }

        trades.forEach(trade => {
            const pnlVal = parseFloat(trade.pnl) || 0;
            const row = `<tr>
                <td>${trade.date || ''}</td>
                <td><strong>${trade.pair || ''}</strong></td>
                <td style="color:${trade.direction === 'LONG' ? '#10b981' : '#ef4444'}">${trade.direction || ''}</td>
                <td class="${trade.outcome === 'WIN' ? 'win' : trade.outcome === 'LOSS' ? 'loss' : ''}">${trade.outcome || ''}</td>
                <td class="${pnlVal >= 0 ? 'win' : 'loss'}">$${pnlVal.toFixed(2)}</td>
            </tr>`;
            tbody.insertAdjacentHTML('beforeend', row);
        });
    }

    function clearJournal() {
        if (confirm("Are you sure you want to clear all journal entries?")) {
            localStorage.removeItem('smc_journal_trades');
            renderTable();
            document.getElementById('status').innerText = "Journal cleared.";
        }
    }

    // Load table on startup
    window.onload = renderTable;
</script>
</body>
</html>
