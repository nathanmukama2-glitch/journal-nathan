<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMC Trading Journal</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        h2, h3 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-muted);
        }

        input, select, textarea, button {
            width: 100%;
            padding: 10px 12px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #0f172a;
            color: var(--text-main);
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .row > div {
            flex: 1;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-main);
        }

        .checkbox-item input {
            width: auto;
            margin: 0;
            cursor: pointer;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            font-size: 15px;
            margin-top: 18px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--primary-hover);
        }

        .btn-calc {
            background: #475569;
            margin-top: 8px;
            padding: 8px;
            font-size: 12px;
        }

        .calc-box {
            background: #0f172a;
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            padding: 10px;
            margin-top: 10px;
            font-size: 13px;
        }

        .calc-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .calc-row:last-child {
            margin-bottom: 0;
        }

        .val-pass { color: var(--success); font-weight: bold; }
        .val-fail { color: var(--danger); font-weight: bold; }

        .summary {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            text-align: center;
        }

        .summary-box {
            background: #0f172a;
            padding: 12px 8px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .summary-box span {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .summary-box strong {
            font-size: 16px;
        }

        #status {
            margin-top: 8px;
            font-weight: 600;
            text-align: center;
            font-size: 13px;
            min-height: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            margin-top: 10px;
        }

        th, td {
            padding: 8px 6px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
        }

        .win { color: var(--success); font-weight: bold; }
        .loss { color: var(--danger); font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>SMC Trading Journal</h2>
    <div id="status">Ready...</div>

    <!-- Trade Form -->
    <div class="card">
        <form id="tradeForm">
            <h3>Log Strategy Entry</h3>

            <div class="row">
                <div>
                    <label>Date</label>
                    <input type="date" id="tDate" required>
                </div>
                <div>
                    <label>Pair</label>
                    <select id="tPair" required>
                        <option value="EURUSD">EUR/USD</option>
                        <option value="GBPUSD">GBP/USD</option>
                        <option value="XAUUSD">XAU/USD (Gold)</option>
                        <option value="BTCUSD">BTC/USD</option>
                        <option value="USDJPY">USD/JPY</option>
                        <option value="AUDUSD">AUD/USD</option>
                        <option value="OTHER">Other</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div>
                    <label>Direction</label>
                    <select id="tDirection" required>
                        <option value="LONG">BUY (Long)</option>
                        <option value="SHORT">SELL (Short)</option>
                    </select>
                </div>
                <div>
                    <label>4H Trend</label>
                    <select id="tTrend4H" required>
                        <option value="Bullish">Bullish ↑</option>
                        <option value="Bearish">Bearish ↓</option>
                    </select>
                </div>
            </div>

            <label>15m Point of Interest (POI)</label>
            <select id="tPoi15m" required>
                <option value="Order Block">Order Block (OB)</option>
                <option value="Liquidity Sweep">Liquidity Sweep / EQH/EQL</option>
                <option value="Fair Value Gap">15m FVG</option>
                <option value="Support/Resistance">S/R Zone</option>
            </select>

            <label>1m Entry Checklist</label>
            <div class="checkbox-group">
                <label class="checkbox-item"><input type="checkbox" id="chkChoch" checked> 1m ChoCh</label>
                <label class="checkbox-item"><input type="checkbox" id="chkFib" checked> Fib &ge; 68%</label>
                <label class="checkbox-item"><input type="checkbox" id="chkFvg" checked> 1m FVG Entry</label>
                <label class="checkbox-item"><input type="checkbox" id="chkMaxRisk" checked> Risk &le; $6.00</label>
            </div>

            <!-- Price & Fib Verification Engine -->
            <label>Execution & Price Verification</label>
            <div class="row">
                <div>
                    <label>Swing High (1m)</label>
                    <input type="number" step="any" id="pHigh" placeholder="0.0000">
                </div>
                <div>
                    <label>Swing Low (1m)</label>
                    <input type="number" step="any" id="pLow" placeholder="0.0000">
                </div>
            </div>

            <div class="row">
                <div>
                    <label>Entry Price</label>
                    <input type="number" step="any" id="pEntry" placeholder="0.0000" required>
                </div>
                <div>
                    <label>Stop Loss (SL)</label>
                    <input type="number" step="any" id="pSL" placeholder="0.0000" required>
                </div>
            </div>

            <div class="row">
                <div>
                    <label>Take Profit (TP)</label>
                    <input type="number" step="any" id="pTP" placeholder="0.0000" required>
                </div>
                <div>
                    <label>Lot Size</label>
                    <input type="number" step="0.01" id="pLot" value="0.01" required>
                </div>
            </div>

            <button type="button" class="btn-calc" onclick="verifyStrategyMetrics()">Verify Fib Retracement & Max Risk</button>

            <div class="calc-box" id="calcResults">
                <div class="calc-row"><span>Fib Retracement:</span> <span id="resFib">-- %</span></div>
                <div class="calc-row"><span>Calculated Risk:</span> <span id="resRisk">$0.00</span></div>
                <div class="calc-row"><span>Risk Check (&le; $6.00):</span> <span id="resRiskStatus">--</span></div>
            </div>

            <label>Outcome Status</label>
            <div class="row">
                <div>
                    <select id="tOutcome">
                        <option value="WIN">WIN (TP Hit)</option>
                        <option value="LOSS">LOSS (SL Hit)</option>
                        <option value="BE">Breakeven</option>
                        <option value="OPEN">Open Trade</option>
                    </select>
                </div>
                <div>
                    <input type="number" step="0.01" id="tPnL" placeholder="PnL ($ e.g. +18.00)">
                </div>
            </div>

            <label>Notes & Confluences</label>
            <input type="text" id="tNotes" placeholder="Reasoning, emotions, or market conditions...">

            <button type="submit">Save Trade Entry</button>
        </form>
    </div>

    <!-- Analytics Dashboard -->
    <div class="card">
        <h3>Performance Overview</h3>
        <div class="summary">
            <div class="summary-box">
                <span>Total PnL</span>
                <strong id="stat-pnl" class="win">$0.00</strong>
            </div>
            <div class="summary-box">
                <span>Win Rate</span>
                <strong id="stat-winrate">0%</strong>
            </div>
            <div class="summary-box">
                <span>Rule Compliance</span>
                <strong id="stat-compliance" class="win">100%</strong>
            </div>
        </div>
    </div>

    <!-- Trade History Table -->
    <div class="card">
        <h3>Recent Trade Entries</h3>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Pair</th>
                        <th>Dir</th>
                        <th>Fib %</th>
                        <th>Risk ($)</th>
                        <th>Outcome</th>
                        <th>PnL ($)</th>
                    </tr>
                </thead>
                <tbody id="trade-history-body">
                    <!-- Dynamic Rows Insertion -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Paste your Google Apps Script Web App URL below
    const scriptURL = 'https://script.google.com/macros/s/AKfycbweUuJj1Slb7tMll6Bdu54uYfql649Z5tBXmrVVeb7ihHSGNHyzlsvxwVXeFLclVuC4/exec';

    // Set default date to current date
    document.getElementById('tDate').valueAsDate = new Date();

    // Verify 68% Fib level & $6.00 max risk limit
    function verifyStrategyMetrics() {
        const direction = document.getElementById('tDirection').value;
        const high = parseFloat(document.getElementById('pHigh').value) || 0;
        const low = parseFloat(document.getElementById('pLow').value) || 0;
        const entry = parseFloat(document.getElementById('pEntry').value) || 0;
        const sl = parseFloat(document.getElementById('pSL').value) || 0;
        const lot = parseFloat(document.getElementById('pLot').value) || 0.01;
        const pair = document.getElementById('tPair').value;

        // Calculate Fib %
        let fibPct = 0;
        if (high > 0 && low > 0 && entry > 0 && high > low) {
            if (direction === 'LONG') {
                fibPct = ((high - entry) / (high - low)) * 100;
            } else {
                fibPct = ((entry - low) / (high - low)) * 100;
            }
            fibPct = 100 - fibPct;
        }

        const resFib = document.getElementById('resFib');
        if (fibPct > 0) {
            resFib.innerText = fibPct.toFixed(1) + "%";
            if (fibPct >= 68) {
                resFib.className = "val-pass";
                document.getElementById('chkFib').checked = true;
            } else {
                resFib.className = "val-fail";
                document.getElementById('chkFib').checked = false;
            }
        } else {
            resFib.innerText = "-- %";
            resFib.className = "";
        }

        // Estimate Risk in USD
        let estRisk = 0;
        if (entry > 0 && sl > 0) {
            const pipDiff = Math.abs(entry - sl);
            let multiplier = 100000;

            if (pair === 'XAUUSD') multiplier = 100;
            else if (pair === 'BTCUSD') multiplier = 1;
            else if (pair.includes('JPY')) multiplier = 1000;

            estRisk = pipDiff * lot * multiplier;
        }

        const resRisk = document.getElementById('resRisk');
        const resRiskStatus = document.getElementById('resRiskStatus');

        resRisk.innerText = "$" + estRisk.toFixed(2);

        if (estRisk > 0) {
            if (estRisk <= 6.00) {
                resRiskStatus.innerText = "PASSED (≤ $6.00)";
                resRiskStatus.className = "val-pass";
                document.getElementById('chkMaxRisk').checked = true;
            } else {
                resRiskStatus.innerText = "EXCEEDED (> $6.00)";
                resRiskStatus.className = "val-fail";
                document.getElementById('chkMaxRisk').checked = false;
            }
        } else {
            resRiskStatus.innerText = "--";
            resRiskStatus.className = "";
        }

        return { fibPct, estRisk };
    }

   // Submit and Log Trade to Google Sheets
document.getElementById('tradeForm').addEventListener('submit', function(e) {
    e.preventDefault();

    document.getElementById('status').innerText = "Saving to Google Sheets...";
    const metrics = verifyStrategyMetrics();

    const formData = new FormData();
    formData.append('date', document.getElementById('tDate').value);
    formData.append('pair', document.getElementById('tPair').value);
    formData.append('direction', document.getElementById('tDirection').value);
    formData.append('trend4H', document.getElementById('tTrend4H').value);
    formData.append('poi15m', document.getElementById('tPoi15m').value);
    formData.append('fibPct', metrics.fibPct.toFixed(1));
    formData.append('estRisk', metrics.estRisk.toFixed(2));
    formData.append('outcome', document.getElementById('tOutcome').value);
    formData.append('pnl', parseFloat(document.getElementById('tPnL').value) || 0);
    formData.append('notes', document.getElementById('tNotes').value);

    fetch(scriptURL, { 
        method: 'POST', 
        mode: 'no-cors', // Bypasses browser CORS restrictions for Google Apps Script
        body: formData 
    })
    .then(() => {
        document.getElementById('status').innerText = "✅ Saved to Google Sheets!";
        setTimeout(() => { document.getElementById('status').innerText = "Ready..."; }, 2500);
        this.reset();
        document.getElementById('tDate').valueAsDate = new Date();
        
        // Wait 1.5s for Google Sheets database reflection before refreshing UI
        setTimeout(fetchTradesFromSheet, 1500);
    })
    .catch(err => {
        console.error(err);
        document.getElementById('status').innerText = "❌ Error saving trade";
    });
});
    // Fetch Trades directly from Google Sheets
    function fetchTradesFromSheet() {
        if (!scriptURL || scriptURL === 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE') return;

        fetch(scriptURL)
            .then(res => res.json())
            .then(trades => {
                renderDashboard(trades.reverse()); // Show newest first
            })
            .catch(err => {
                console.log("Error fetching sheet data:", err);
            });
    }

    // Render Analytics & History Table
    function renderDashboard(journalEntries) {
        const tbody = document.getElementById('trade-history-body');
        tbody.innerHTML = "";

        let totalPnL = 0;
        let wins = 0;
        let totalClosed = 0;

        journalEntries.forEach(trade => {
            const pnlVal = parseFloat(trade.pnl) || 0;
            if (trade.outcome === 'WIN') { wins++; totalClosed++; }
            if (trade.outcome === 'LOSS') { totalClosed++; }
            totalPnL += pnlVal;

            const row = `<tr>
                <td>${trade.date}</td>
                <td><strong>${trade.pair}</strong></td>
                <td style="color:${trade.direction === 'LONG' ? '#10b981' : '#ef4444'}">${trade.direction}</td>
                <td>${trade.fibPct}%</td>
                <td>$${trade.estRisk}</td>
                <td class="${trade.outcome === 'WIN' ? 'win' : trade.outcome === 'LOSS' ? 'loss' : ''}">${trade.outcome}</td>
                <td class="${pnlVal >= 0 ? 'win' : 'loss'}">$${pnlVal.toFixed(2)}</td>
            </tr>`;
            tbody.insertAdjacentHTML('beforeend', row);
        });

        const statPnL = document.getElementById('stat-pnl');
        statPnL.innerText = "$" + totalPnL.toFixed(2);
        statPnL.className = totalPnL >= 0 ? "win" : "loss";

        const winRate = totalClosed > 0 ? Math.round((wins / totalClosed) * 100) : 0;
        document.getElementById('stat-winrate').innerText = winRate + "%";
    }

    window.onload = fetchTradesFromSheet;
</script>
</body>
</html>
